apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS overlay: every service comes from its own kustomization dir (ESO configtree
# pattern). The ECR image swap, the per-service ExternalSecret, the volume mount,
# and the shared spring-secrets component all live inside each service dir.
resources:
  - namespace.yaml
  - gateway                 # ESO pattern (was a top-level vault-off patch in Phase 2)
  - authorization-server
  - product-service
  - inventory-service
  - order-service
  - orchestrator-service
  - payment-service
  - bff-service
  - mock-paypal-service
  - frontend                # storefront SPA (same-origin, Phase 5a)
  - ingress-gateway.yaml    # the ALB Ingress: 8 service prefixes → gateway, / → frontend
