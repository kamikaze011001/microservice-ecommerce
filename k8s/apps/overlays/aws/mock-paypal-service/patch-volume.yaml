apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-paypal-service
  namespace: apps
spec:
  template:
    spec:
      containers:
        - name: mock-paypal-service
          volumeMounts:
            - { name: app-config, mountPath: /etc/app-config, readOnly: true }
      volumes:
        - name: app-config
          secret:
            secretName: mock-paypal-service-config
