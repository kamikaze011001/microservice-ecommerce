apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-config
    creationPolicy: Owner
  dataFrom:
    - extract: { key: app/ecommerce }     # gateway reads api_role from mongo (common ctx)
    - extract: { key: app/gateway }
