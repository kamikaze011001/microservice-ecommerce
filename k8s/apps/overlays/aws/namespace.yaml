apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels: { name: apps }
# The base manifests deploy into the `apps` namespace but don't create it (the
# local kind flow makes it ad hoc). On EKS `kubectl apply -k` is the only
# bring-up, so the overlay must create the namespace itself. kubectl applies
# Namespace before namespaced kinds, so this lands first.
