apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: apps
spec:
  template:
    spec:
      containers:
        - name: orchestrator-service
          volumeMounts:
            - { name: app-config, mountPath: /etc/app-config, readOnly: true }
      volumes:
        - name: app-config
          secret:
            secretName: orchestrator-service-config
