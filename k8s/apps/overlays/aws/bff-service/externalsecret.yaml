apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-service
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: bff-service-config
    creationPolicy: Owner
  dataFrom:
    - extract: { key: app/ecommerce }
    - extract: { key: app/bff-service }
