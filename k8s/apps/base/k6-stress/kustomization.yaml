apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - job.yaml
# kustomize materializes script.js into a ConfigMap referenced by job.yaml.
# Edit script.js and re-apply to update the load profile.
configMapGenerator:
  - name: k6-stress-script
    files:
      - script.js
# Stable name — Jobs reference it by name. Without this, kustomize
# appends a content hash and the Job's volume.configMap.name no longer matches.
generatorOptions:
  disableNameSuffixHash: true
