apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - job.yaml
  - payment-job.yaml
# kustomize materializes each script into a ConfigMap referenced by its Job.
# Edit the script and re-apply to update the load profile.
#  - script.js        -> browse-only stress (HPA/ingress), Job k6-stress
#  - payment-flow.js  -> full payment-saga stress w/ 90/5/5 decision mix,
#                        Job k6-payment-stress (drives mock-paypal-service)
configMapGenerator:
  - name: k6-stress-script
    files:
      - script.js
  - name: k6-payment-script
    files:
      - payment-flow.js
# Stable name — Jobs reference it by name. Without this, kustomize
# appends a content hash and the Job's volume.configMap.name no longer matches.
generatorOptions:
  disableNameSuffixHash: true
