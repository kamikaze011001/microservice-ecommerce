apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-server
  namespace: apps
  labels:
    app: authorization-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-server
  template:
    metadata:
      labels:
        app: authorization-server
    spec:
      containers:
        - name: authorization-server
          image: localhost:5001/authorization-server:dev
          # Always re-pull: :dev is a MUTABLE tag rebuilt in place by
          # k8s/images/build.sh. IfNotPresent serves stale cached layers on kind
          # nodes so code changes never reach the pod. See k8s/CLAUDE.md.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6666
            - name: management
              containerPort: 19091
          # APPLICATION_MAIL_USERNAME / APPLICATION_MAIL_PASSWORD for SMTP come
          # from the app-secrets Secret (built from k8s/.env by
          # `make k8s-app-secrets`). They're user-owned creds — kept out of git
          # and out of Vault; application.yml reads them as ${ENV} placeholders.
          # optional:true so the pod still starts if the Secret is absent (creds
          # just resolve empty → no mail).
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          env:
            # Vault dev mode — the token is `root` (set in vault values.yaml).
            # AWS overlay swaps this for AppRole + KMS-unsealed Vault; the env
            # var goes away entirely (Spring Cloud Vault uses AppRole login).
            - name: VAULT_TOKEN
              value: root
            - name: SPRING_CLOUD_VAULT_URI
              value: http://vault.infra.svc.cluster.local:8200
            # Memory caps for the kind cluster. -XX:MaxRAMPercentage tells the
            # JVM to size heap as a fraction of the cgroup limit (memory.limits
            # below), so heap auto-adapts if we bump the limit.
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+UseStringDeduplication"
            - { name: MALLOC_ARENA_MAX, value: "2" }
          resources:
            requests:
              # bcrypt password hashing (cost 10, ~80ms CPU each) is the login
              # bottleneck. At a 1-core limit, concurrent logins queue → p95 ~4s
              # under 50 VUs. Give it room and let the HPA add replicas.
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 768Mi
          # Liveness: just "is the JVM alive?" — checks management port so we
          # don't get false negatives from a busy http thread pool.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          # Readiness: gated on db, redis, mail (see readiness.include in
          # application.yml). Long initialDelay because Spring Cloud Vault
          # blocks startup on vault.fail-fast=true.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
