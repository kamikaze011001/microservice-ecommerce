apiVersion: v1
kind: Service
metadata:
  name: authorization-server
  namespace: apps
  labels:
    app: authorization-server
spec:
  type: ClusterIP
  selector:
    app: authorization-server
  ports:
    - name: http
      port: 6666
      targetPort: http
    # Management port stays in-cluster only — never exposed via the gateway.
    # Prometheus scrapes it via the ServiceMonitor below.
    - name: management
      port: 19091
      targetPort: management
