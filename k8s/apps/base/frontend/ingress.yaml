apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: apps
  labels: { app: frontend }
spec:
  ingressClassName: nginx
  rules:
    # SPA assets. All XHR/fetch traffic goes to api.microecom.local instead
    # (see gateway/ingress.yaml). Splitting hosts keeps cookies/CORS scoped.
    - host: microecom.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
