apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apps
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # Caddy serving the Vite build output. Image built from
          # frontend/Dockerfile with VITE_API_BASE_URL=http://api.microecom.local
          # baked in at build time (Vite inlines env vars at compile).
          image: localhost:5001/frontend:dev
          # Always re-pull: :dev is a MUTABLE tag rebuilt in place. IfNotPresent
          # serves the stale cached bundle on kind nodes so frontend code changes
          # never reach the pod. See k8s/CLAUDE.md.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          # Tiny — just Caddy + static assets. No JVM, no GC.
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
          # Caddy is alive the moment the process starts; no warmup.
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
