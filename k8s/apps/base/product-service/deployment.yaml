apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: apps
  labels: { app: product-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: localhost:5001/product-service:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 7777 }
            - { name: management, containerPort: 17777 }
          env:
            - { name: VAULT_TOKEN, value: root }
            - { name: SPRING_CLOUD_VAULT_URI, value: http://vault.infra.svc.cluster.local:8200 }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC" }
            - { name: MALLOC_ARENA_MAX, value: "2" }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 1500m, memory: 768Mi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
