apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: apps
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: localhost:5001/payment-service:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8484 }
            - { name: management, containerPort: 18484 }
          # PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET / PAYPAL_TUNNEL_URL come from
          # the app-secrets Secret (built from k8s/.env by `make k8s-app-secrets`).
          # User-owned creds — kept out of git and Vault; application.yml reads
          # them as ${ENV} placeholders. optional:true so the pod starts even if
          # the Secret is absent.
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          env:
            - { name: VAULT_TOKEN, value: root }
            - { name: SPRING_CLOUD_VAULT_URI, value: http://vault.infra.svc.cluster.local:8200 }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC" }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 768Mi }   # 512Mi OOMKilled at startup (JVM non-heap)
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
