apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: apps
  labels: { app: gateway }
  # nginx-specific knobs. The ingressClassName below picks the controller;
  # these annotations tune *that* controller's behaviour for this Ingress.
  annotations:
    # k6 fires bursts of long POSTs (orders, payments). Defaults are 60s —
    # bump so we don't see spurious 504s during stress runs.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # gateway already prefixes routes with /<service-name>; we don't want
    # nginx to strip or rewrite anything.
    nginx.ingress.kubernetes.io/use-regex: "false"
spec:
  ingressClassName: nginx
  rules:
    # api.microecom.local owns all backend traffic. Frontend (when added)
    # will get its own Ingress on microecom.local. Two hostnames = clean
    # cookie/CORS boundary, mirrors prod (api.<domain> pattern).
    - host: api.microecom.local
      http:
        paths:
          # Spring Cloud Gateway is the only backend here. It routes by
          # path prefix (/authorization-server, /product-service, …) to
          # the downstream Pods — Ingress doesn't need to know about them.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
