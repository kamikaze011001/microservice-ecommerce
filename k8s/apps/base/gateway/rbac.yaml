# RBAC for Spring Cloud Kubernetes service discovery (k8s profile). The gateway
# resolves `lb://` service-ids and the JWKS host against the k8s API, which means
# its ServiceAccount must be able to read Services/Endpoints in the `apps`
# namespace. Scoped to a dedicated `gateway` SA (not the shared `default` SA) and
# to read-only verbs in this one namespace — least privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-discovery
  namespace: apps
rules:
  # `pods` get is required even in SERVICE mode: Spring Cloud Kubernetes reads the
  # gateway's own pod at startup (isInsideKubernetes() + the discovery health
  # initializer). Without it the context fails to refresh and the app never boots.
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  # k8s 1.33+ deprecates the core Endpoints API in favour of EndpointSlices;
  # grant both so discovery keeps working across versions.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-discovery
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-discovery
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: apps
