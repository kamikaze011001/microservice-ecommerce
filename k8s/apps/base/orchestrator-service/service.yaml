apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: apps
  labels: { app: orchestrator-service }
spec:
  type: ClusterIP
  selector: { app: orchestrator-service }
  ports:
    - { name: http, port: 9999, targetPort: http }
    - { name: management, port: 19999, targetPort: management }
