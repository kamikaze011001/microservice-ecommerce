apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: apps
  labels: { app: orchestrator-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orchestrator-service }
  template:
    metadata:
      labels: { app: orchestrator-service }
    spec:
      containers:
        - name: orchestrator-service
          image: localhost:5000/orchestrator-service:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 9999 }
            - { name: management, containerPort: 19999 }
          env:
            - { name: VAULT_TOKEN, value: root }
            - { name: SPRING_CLOUD_VAULT_URI, value: http://vault.infra.svc.cluster.local:8200 }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC" }
            - { name: MALLOC_ARENA_MAX, value: "2" }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 768Mi }   # 512Mi OOMKilled at startup (JVM non-heap)
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
