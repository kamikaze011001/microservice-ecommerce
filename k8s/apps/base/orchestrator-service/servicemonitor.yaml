apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orchestrator-service
  namespace: apps
  labels: { app: orchestrator-service }
spec:
  selector:
    matchLabels: { app: orchestrator-service }
  namespaceSelector:
    matchNames: [apps]
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
