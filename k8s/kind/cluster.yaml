kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: microecom
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
  - role: worker
# NOTE: the local registry (localhost:5001) is wired up via the containerd
# `config_path` hosts.toml mechanism in k8s/kind/registry.sh, NOT via a
# `containerdConfigPatches` mirrors block here. containerd 2.x (shipped in
# kindest/node from kind >= 0.30) rejects inline `registry.mirrors` when
# `config_path` is set ("mirrors cannot be set when config_path is provided"),
# which kills the CRI plugin and makes kubeadm init time out. See registry.sh.
