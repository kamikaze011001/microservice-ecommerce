controller:
  service:
    type: NodePort
    nodePorts:
      http: 80
      https: 443
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
  watchIngressWithoutClass: true
