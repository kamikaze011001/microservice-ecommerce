server:
  # LOCAL-DEV ONLY. Dev mode keeps Vault unsealed with an in-memory
  # backend and a hardcoded root token — perfect for kind, fatal for
  # anywhere reachable. AWS overlay disables dev mode and configures:
  #   - HA storage (DynamoDB or integrated Raft)
  #   - auto-unseal via AWS KMS
  #   - AppRole auth (no root token in prod)
  # See k8s/infra/overlays/aws/README.md before deploying.
  dev:
    enabled: true
    devRootToken: "root"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }
# Agent injector DISABLED. This stack's services read Vault directly via Spring
# Cloud Vault (SPRING_CLOUD_VAULT_URI + TOKEN auth — see apps/base/_template/
# deployment.yaml); nothing uses sidecar secret-injection (no
# vault.hashicorp.com/agent-inject annotations anywhere). Leaving the injector
# on also broke `make k8s-infra` idempotency: the injector self-injects its CA
# into its MutatingWebhookConfiguration (field manager "vault-k8s"), so a second
# `helm upgrade` hits a server-side-apply caBundle ownership conflict and fails.
# Disabling it removes that webhook entirely. AWS overlay can re-enable + use
# proper auth if agent injection is ever wanted.
injector:
  enabled: false
