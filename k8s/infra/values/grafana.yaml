# Standalone Grafana. Reads VictoriaMetrics as a Prometheus-type datasource
# (MetricsQL is a PromQL superset, so the stock Prometheus datasource works).
# Chart: grafana/grafana 10.5.15.

# LOCAL-DEV ONLY. AWS overlay replaces with admin.existingSecret backed by
# ExternalSecrets + AWS Secrets Manager.
adminPassword: admin

service:
  type: ClusterIP

# Browser access via ingress-nginx (maps host :80 → cluster). Mirrors the
# existing host split: microecom.local (SPA) / api.microecom.local (gateway) /
# media.microecom.local (minio). Add `127.0.0.1 grafana.microecom.local` to
# /etc/hosts. Dedicated host (root path) → no grafana.ini sub-path config needed.
ingress:
  enabled: true
  ingressClassName: nginx
  path: /
  pathType: Prefix
  hosts:
    - grafana.microecom.local

persistence:
  enabled: false        # dashboards are provisioned from code; no PVC needed locally

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 200m, memory: 256Mi }

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://vmsingle.monitoring.svc.cluster.local:8428
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    k6:
      gnetId: 19665           # k6 Prometheus
      revision: 3
      datasource: VictoriaMetrics
    jvm-micrometer:
      gnetId: 4701            # JVM (Micrometer)
      revision: 10
      datasource: VictoriaMetrics
    spring-boot-3:
      gnetId: 19004           # Spring Boot 3.x Statistics
      revision: 1
      datasource: VictoriaMetrics
    k8s-pods:
      gnetId: 15760           # Kubernetes / Views / Pods
      revision: 38
      datasource: VictoriaMetrics
