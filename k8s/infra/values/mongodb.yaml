# LOCAL-DEV ONLY. See note in mysql.yaml — same pattern applies.
# AWS overlay must replace with auth.existingSecret backed by
# ExternalSecrets + AWS Secrets Manager.
auth:
  enabled: true
  rootUser: root
  rootPassword: root
  databases: [ecommerce]
  usernames: [ecommerce]
  passwords: [ecommerce]
architecture: standalone
persistence:
  size: 4Gi
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { cpu: 800m, memory: 1Gi }
