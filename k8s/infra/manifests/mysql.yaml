# MySQL — Docker Official Image (mysql:8.0.40), single node.
# Replaces the Bitnami chart (docker.io/bitnami/mysql deleted 2025-09-29).
# Pinned to 8.0.40 to match the version in the project CLAUDE.md.
#
# Topology: PRIMARY of a 1-primary/2-replica GTID setup. server-id=1 + log-bin
# + gtid-mode make this the replication source; replicas live in
# mysql-replica.yaml and replicate via SOURCE_AUTO_POSITION=1 (configured by
# install.sh). The `mysql` Service (writes) selects this component=primary pod;
# the `mysql-replica` Service (reads, mysql-replica-service.yaml) selects the
# component=replica pods.
#
# LOCAL-DEV ONLY: plaintext creds bound to the kind cluster. The AWS overlay
# (k8s/infra/overlays/aws/) replaces MySQL with RDS + ExternalSecrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: infra
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: ecommerce_dev
  MYSQL_USER: ecommerce
  MYSQL_PASSWORD: ecommerce
  MYSQL_REPL_USER: repl_user
  MYSQL_REPL_PASSWORD: replica_ecommerce
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: infra
  labels:
    app.kubernetes.io/name: mysql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: primary
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: infra
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: primary
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: primary
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.40
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-credentials
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=row
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --default-authentication-plugin=mysql_native_password
            # Parity with docker/mysql.yml. WRITESET dependency tracking is what
            # lets the replicas' LOGICAL_CLOCK parallel workers actually apply
            # transactions concurrently (15s lag at peak, stress 2026-06-10).
            - --max-connections=300
            - --binlog-transaction-dependency-tracking=WRITESET
            - --transaction-write-set-extraction=XXHASH64
            - --binlog-group-commit-sync-delay=1000
            - --binlog-group-commit-sync-no-delay-count=10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-proot"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-proot"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
