# Kafka — Apache official image (apache/kafka:3.9.1), single-node KRaft.
# Replaces the Bitnami chart (docker.io/bitnami/kafka deleted 2025-09-29).
#
# Single node = one process in BOTH roles (broker + controller). It is its own
# controller quorum, talking to itself over loopback (1@localhost:9093). No
# ZooKeeper.
#
# MIGRATION TRAP: the Apache image uses KAFKA_* env vars; Bitnami used
# KAFKA_CFG_*. The entrypoint's `configure` script strips the KAFKA_ prefix and
# lowercases the rest into server.properties keys. Bitnami-style KAFKA_CFG_*
# names are silently ignored here.
#
# KRaft requires a cluster ID: the entrypoint runs
#   kafka-storage format --cluster-id=$CLUSTER_ID --ignore-formatted
# CLUSTER_ID is mandatory. It is NOT a secret, so it is hardcoded below — a
# fixed value is reproducible and --ignore-formatted makes re-runs a no-op
# against a persisted PVC (it only formats an empty data dir on first boot).
#
# Consumers connect at kafka.infra.svc.cluster.local:9092 (PLAINTEXT) — both
# the core services (via Vault, seeded by 03-vault-seed) and kafka-connect.
# Replication factor 1 everywhere (single broker). App/saga topics are created
# by Spring KafkaAdmin (NewTopic beans) + auto-create; Connect creates its own
# internal topics via AdminClient — so no separate topic-creation Job.
#
# LOCAL-DEV ONLY: PLAINTEXT, no SASL/TLS. AWS overlay points services at MSK
# (bootstrap + SASL via Vault) — a Vault-only change, no app change.
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infra
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infra
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      securityContext:
        # apache/kafka runs as uid 1000 (appuser); fsGroup makes the PVC writable.
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - name: CLUSTER_ID
              value: "mid7L2nDStmrxphjf7r-Yg"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # CONTROLLER bound for the quorum, PLAINTEXT for clients.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Only the client listener is advertised — controllers don't serve clients.
            # MUST be the Service DNS so remote consumers reach this broker.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.infra.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Single-node quorum: this node votes for itself over loopback.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # Single broker → every internal topic replicates x1.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1536Mi }
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
