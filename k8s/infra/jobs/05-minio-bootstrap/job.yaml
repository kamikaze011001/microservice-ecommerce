apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          env:
            - name: MINIO_ENDPOINT
              value: http://minio.infra.svc.cluster.local:9000
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            - name: MINIO_BUCKET
              value: ecommerce-media
          command: ["/bin/sh", "/scripts/seed.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: minio-bootstrap-scripts
            defaultMode: 0755
