apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-seed
  namespace: bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
          command: ["/bin/sh", "/scripts/seed.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: sql
              mountPath: /seed
      volumes:
        # Both configMaps are created imperatively by `make k8s-seed` (NOT a
        # kustomize generator): docker/ecommerce.sql is out-of-tree and kubectl's
        # embedded kustomize forbids out-of-tree generator sources. This Job is
        # applied with plain `kubectl apply -f`, bypassing kustomize — its
        # nameReference transformer otherwise rewrites the sql volume's configMap
        # to mysql-seed-scripts. See Makefile k8s-seed + SCAR in k8s/CLAUDE.md.
        - name: scripts
          configMap:
            name: mysql-seed-scripts
            defaultMode: 0755
        - name: sql
          configMap:
            name: mysql-seed-sql
