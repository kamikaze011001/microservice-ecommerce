# deploy/secrets/gateway.yaml → vault:secret/gateway | asm:app/gateway
#
# The single external entry point. Six keys everywhere, plus seven route URIs
# on the kubernetes envs only.
#
# application.jwk-set-uri keeps its Eureka-style hostname in every env because
# it is resolved by the client-side load balancer under compose and by the
# `authorization-server` Service name under k8s/aws — the same string happens to
# work both ways. Captured identical in all three goldens; left as one scalar.
application.jwk-set-uri: http://authorization-server/authorization-server/.well-known/jwks.json

jwt.token.cache.refresh-minutes: "30"
jwt.token.cache.force-refresh-threshold: "5"
jwt.token.retry.max-attempts: "3"
jwt.token.retry.delay: "500"

server.port: "6868"

# --- Route targets (k8s + aws only) ------------------------------------------
# Under compose these keys are ABSENT and application.yml's `lb://NAME` Eureka
# defaults win. With Eureka disabled on the kubernetes envs there is nothing to
# resolve `lb://` against, so each route is overridden with a concrete cluster
# DNS address. Absent — not present-and-empty — because an empty uri would make
# Spring Cloud Gateway fail to build the route rather than fall back.
#
# Only the host is a context ref: every port below is the target service's own
# `server.port` from its canonical file and is identical in every env.
gateway.routes.authorization-server.uri:
  value: "http://{{svc.authorization-server.host}}:6666"
  envs: [k8s, aws]
gateway.routes.bff-service.uri:
  value: "http://{{svc.bff-service.host}}:8087"
  envs: [k8s, aws]
gateway.routes.inventory-service.uri:
  value: "http://{{svc.inventory-service.host}}:6969"
  envs: [k8s, aws]
gateway.routes.mock-paypal-service.uri:
  value: "http://{{svc.mock-paypal-service.host}}:8585"
  envs: [k8s, aws]
gateway.routes.order-service.uri:
  value: "http://{{svc.order-service.host}}:9696"
  envs: [k8s, aws]
gateway.routes.payment-service.uri:
  value: "http://{{svc.payment-service.host}}:8484"
  envs: [k8s, aws]
gateway.routes.product-service.uri:
  value: "http://{{svc.product-service.host}}:7777"
  envs: [k8s, aws]
