# deploy/secrets/mock-paypal-service.yaml → vault:secret/mock-paypal-service | asm:app/mock-paypal-service
#
# The PayPal stand-in used by k6 runs and local dev. mock.public-base-url is
# handed to the BROWSER as the approve/redirect origin, so it must be an
# address the browser can reach — which is why it is the one env-specific
# value here.
#
# The `/mock-paypal-service` suffix is this service's context-path from
# application.yml and is the same everywhere, so only the ORIGIN is a context
# ref. On aws that origin is deliberately the empty string, which makes the
# whole value the bare path `/mock-paypal-service` — a same-origin relative
# URL, because the SPA and the API are served from one ALB there. Transcribed
# as captured; not normalised to an absolute URL.
mock.public-base-url: "{{mockPaypal.publicOrigin}}/mock-paypal-service"

server.port: "8585"
