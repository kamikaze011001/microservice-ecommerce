# deploy/secrets/payment-service.yaml → vault:secret/payment-service | asm:app/payment-service
#
# The only file with `owner: user` keys. Compose and k8s carry 5 keys here; aws
# carries 8. The three extra are the PayPal credentials and the tunnel URL.
#
# On compose and k8s the PayPal credentials arrive through docker/.env → the
# `app-secrets` Secret → envFrom, so they must NOT also be written into the
# secrets backend. On aws there is no env file, so they are seeded. `owner:
# user` states that fact once; which envs it applies to is decided by the
# context's userCredDelivery, not by an envs: list repeated here.
application.paypal.client-id:
  value: "${PAYPAL_CLIENT_ID}"
  owner: user
application.paypal.client-secret:
  value: "${PAYPAL_CLIENT_SECRET}"
  owner: user

# aws-only. Compose and k8s drive PayPal through mock-paypal-service, which
# needs no publicly reachable callback host.
application.paypal.tunnel-url:
  value: "{{paypal.tunnelUrl}}"
  envs: [aws]

application.paypal.base-url: https://api-m.sandbox.paypal.com

# Appended to application.frontend.base-url to build the PayPal return URLs.
# Gateway-prefixed because PayPal redirects the BROWSER here, and the browser
# only ever sees the gateway.
application.paypal.success-path: /payment-service/v1/paypal:success
application.paypal.cancel-path: /payment-service/v1/paypal:cancel

# Empty on aws pending the Phase 5b domain work — carried forward as-is rather
# than invented, because this phase claims behavioural equivalence. An empty
# base makes the return URLs relative, which the same-origin ALB setup happens
# to tolerate; it is still a known gap, not the intended end state.
application.frontend.base-url: "{{frontend.baseUrl}}"

server.port: "8484"
