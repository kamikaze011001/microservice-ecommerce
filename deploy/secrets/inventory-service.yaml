# deploy/secrets/inventory-service.yaml → vault:secret/inventory-service | asm:app/inventory-service
#
# All six values are identical in every env. grpc.server.port is the port this
# service LISTENS on; its callers (order-service, bff-service) carry the
# matching host/port on their own side.

application.kafka.group-id.payment.success: payment-success-group
application.kafka.group-id.product.update: product-update-group
application.kafka.topics.inventory-service.inventory-product.update-quantity: inventory-service.inventory-product.update-quantity
application.kafka.topics.inventory-service.product.update: inventory-service.product.update

grpc.server.port: "9090"
server.port: "6969"

# --- MySQL: one datasource through ProxySQL (ADR 0012) ----------------------
# Replaces the shared spring.datasource.{master,slave1,slave2} routing set for
# this service: primary by default, a replica only for @ReplicaRead.
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url: "jdbc:mysql://{{mysql.proxy.host}}:{{mysql.proxy.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.username: "{{mysql.proxy.username}}"
spring.datasource.password: "{{mysql.proxy.password}}"
