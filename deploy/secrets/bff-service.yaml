# deploy/secrets/bff-service.yaml → vault:secret/bff-service | asm:app/bff-service
#
# This is the file where the two discovery modes meet. bff-service fans out to
# three services over HTTP and one over gRPC, so it is the service most exposed
# to HOW peers are addressed.
#
#   compose      Eureka. Feign resolves `product-service` from the registry, so
#                there are no feign.client.*.url overrides at all.
#   k8s / aws    Eureka is disabled (see ecommerce.yaml). Feign has no registry
#                to ask, so every client gets an explicit cluster DNS url.
#
# The two sets are expressed as envs:-gated keys rather than one superset with
# empty values, because an empty feign url is not inert — it makes Feign build
# a request against a relative URI and fail at call time instead of at startup.

# --- Eureka discovery (compose only) -----------------------------------------
eureka.client.service-url.defaultZone:
  value: "http://{{eureka.host}}:8761/eureka/"
  envs: [compose]
eureka.instance.prefer-ip-address:
  value: "true"
  envs: [compose]

# --- Service DNS discovery (k8s + aws only) ----------------------------------
# Ports are literals: each is the target's own server.port and is identical in
# every env, so only the host moves.
feign.client.order-service.url:
  value: "http://{{svc.order-service.host}}:9696"
  envs: [k8s, aws]
feign.client.payment-service.url:
  value: "http://{{svc.payment-service.host}}:8484"
  envs: [k8s, aws]
feign.client.product-service.url:
  value: "http://{{svc.product-service.host}}:7777"
  envs: [k8s, aws]

# --- gRPC to inventory-service (all envs) ------------------------------------
# gRPC never went through Eureka, so this pair is present in every env and only
# the host moves — the same ref order-service uses for the same listener.
inventory.grpc.host: "{{svc.inventory-service.host}}"
inventory.grpc.port: "9090"

server.port: "8087"
