# deploy/secrets/contexts/compose.yaml — docker-compose (make up).
#
# Services run on the HOST and reach infra through published ports, so several
# values are host port mappings, not container ports — e.g. docker/kafka.yml
# maps "8091:8081" for Schema Registry.
#
# Naming convention (keep it when adding keys in later tasks):
#   <infra>.<role>.<host|port|username|password>   infra endpoints, this file
#   svc.<service-name>.host                        in-cluster app services
# A key belongs here only when its value is env-specific. Anything identical
# across all three envs stays a plain scalar in the canonical file.
userCredDelivery: envfrom

# MySQL. One published port per role: master 3306, slave1 3307, slave2 3308.
# The per-role passwords below are the docker/.env literals. Finding (spec,
# Findings): the compose user is `root` with per-role passwords while k8s uses
# root/root and aws uses the RDS master credential — recorded, not fixed here.
mysql.username: root
mysql.master.host: localhost
mysql.master.port: "3306"
mysql.master.password: ecommerce_master
mysql.slave1.host: localhost
mysql.slave1.port: "3307"
mysql.slave1.password: ecommerce_slave1
mysql.slave2.host: localhost
mysql.slave2.port: "3308"
mysql.slave2.password: ecommerce_slave2

redis.host: localhost
redis.port: "6379"
redis.password: ecommerce_redis

mongo.host: localhost
mongo.port: "27017"
mongo.password: ecommerce_mongo

kafka.bootstrap: localhost:9092
schemaRegistry.host: localhost
schemaRegistry.port: "8091"

# --- App services -----------------------------------------------------------
# Everything runs on the host under compose, so service-to-service traffic is
# loopback. inventory-service is the only app service addressed by name: it is
# the one service others reach directly (its gRPC listener) rather than through
# the gateway.
svc.inventory-service.host: localhost

# Eureka is the discovery mechanism in THIS env only — k8s and aws disable it
# in favour of Service DNS — so this key is deliberately compose-only.
eureka.host: localhost

# --- Browser-facing origins -------------------------------------------------
# These land in redirect URLs and presigned links, so they must be reachable
# from the user's browser, not from inside the network.
frontend.baseUrl: http://localhost:5173
mockPaypal.publicOrigin: http://localhost:8585

# --- S3 / MinIO -------------------------------------------------------------
# A local MinIO container with its stock dev credentials, addressed path-style.
# There is no s3.publicEndpoint here: the JVM and the browser dial the same
# localhost address, so core-s3 falls back to s3.endpoint.
s3.endpoint: http://localhost:9000
s3.accessKey: minioadmin
s3.secretKey: minioadmin
s3.bucket: ecommerce-media
s3.region: us-east-1
s3.pathStyle: "true"
s3.publicBaseUrl: http://localhost:9000/ecommerce-media
