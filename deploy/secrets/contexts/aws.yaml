# deploy/secrets/contexts/aws.yaml — EKS.
#
# The managed data tier (RDS, ElastiCache) comes from terraform outputs; the
# self-hosted infra that stayed in-cluster (Kafka, Schema Registry, MongoDB)
# keeps cluster DNS. <terraform:NAME> is legal ONLY in this file, never in a
# canonical service file, and is read from the terraform outputs cache.
#
# Naming convention (keep it when adding keys in later tasks):
#   <infra>.<role>.<host|port|username|password>   infra endpoints, this file
#   svc.<service-name>.host                        in-cluster app services
# A key belongs here only when its value is env-specific. Anything identical
# across all three envs stays a plain scalar in the canonical file.
#
# backend: user-owned credentials (mail, PayPal) are seeded into the secrets
# backend rather than injected from a compose env file, so `owner: user` keys
# resolve in this env only.
userCredDelivery: backend

# RDS: one writer endpoint, one reader endpoint shared by both slave roles.
# The master credential is the same for all three roles by design (the cluster
# has a single master user) — see the spec's Findings.
mysql.username: admin
mysql.master.host: <terraform:rds_primary_endpoint>
mysql.master.port: "3306"
mysql.master.password: <terraform:db_master_password>
mysql.slave1.host: <terraform:rds_replica_endpoint>
mysql.slave1.port: "3306"
mysql.slave1.password: <terraform:db_master_password>
mysql.slave2.host: <terraform:rds_replica_endpoint>
mysql.slave2.port: "3306"
mysql.slave2.password: <terraform:db_master_password>

redis.host: <terraform:redis_primary_endpoint>
redis.port: "6379"
redis.password: <terraform:redis_auth_token>

mongo.host: mongodb.infra.svc.cluster.local
mongo.port: "27017"
mongo.password: ecommerce123

kafka.bootstrap: kafka.infra.svc.cluster.local:9092
schemaRegistry.host: schema-registry.infra.svc.cluster.local
schemaRegistry.port: "8081"

# --- App services -----------------------------------------------------------
# Identical to k8s: only the DATA tier moved to managed AWS services, the app
# tier still runs as Deployments in the `apps` namespace and is addressed by
# cluster DNS.
svc.authorization-server.host: authorization-server.apps.svc.cluster.local
svc.bff-service.host: bff-service.apps.svc.cluster.local
svc.inventory-service.host: inventory-service.apps.svc.cluster.local
svc.mock-paypal-service.host: mock-paypal-service.apps.svc.cluster.local
svc.order-service.host: order-service.apps.svc.cluster.local
svc.payment-service.host: payment-service.apps.svc.cluster.local
svc.product-service.host: product-service.apps.svc.cluster.local

# --- Browser-facing origins -------------------------------------------------
# Both are EMPTY here, and that is what the old aws seeding path actually
# wrote: the storefront is served same-origin off the raw ALB, so a relative
# path is correct until the Phase 5b domain + ACM work lands. Carried forward
# verbatim rather than invented — this phase claims behavioural equivalence and
# nothing more.
frontend.baseUrl: ""
mockPaypal.publicOrigin: ""

# --- PayPal -----------------------------------------------------------------
# The externally reachable shop URL PayPal redirects the buyer back to. Only
# this env has it; compose and k8s reach PayPal through the mock.
paypal.tunnelUrl: <terraform:shop_url>

# --- S3 ---------------------------------------------------------------------
# Real S3: virtual-hosted addressing, credentials via IRSA. The four blanks are
# load-bearing sentinels, not gaps — an empty access key makes core-s3 use
# DefaultCredentialsProvider (the pod's web identity), and an empty endpoint
# makes the SDK derive the regional endpoint itself. See core/core-s3
# S3Config.java. Do not "fix" them by filling in values.
s3.endpoint: ""
s3.publicEndpoint: ""
s3.accessKey: ""
s3.secretKey: ""
s3.bucket: <terraform:s3_bucket_name>
s3.region: ap-southeast-1
s3.pathStyle: "false"
s3.publicBaseUrl: <terraform:s3_public_base_url>
