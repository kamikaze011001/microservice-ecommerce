# deploy/secrets/contexts/k8s.yaml — minikube / local kubernetes.
#
# Eureka is disabled; services address each other and the infra tier by cluster
# DNS. Ports are container ports here, not host mappings.
#
# Naming convention (keep it when adding keys in later tasks):
#   <infra>.<role>.<host|port|username|password>   infra endpoints, this file
#   svc.<service-name>.host                        in-cluster app services
# A key belongs here only when its value is env-specific. Anything identical
# across all three envs stays a plain scalar in the canonical file.
userCredDelivery: envfrom

# MySQL. The in-cluster chart ships a single root credential and both replicas
# share one Service, so all three roles resolve to root@3306. Finding (spec,
# Findings): using the root account for application traffic is recorded, not
# fixed here — changing it would break the equivalence proof.
mysql.username: root
mysql.master.host: mysql.infra.svc.cluster.local
mysql.master.port: "3306"
mysql.master.password: root
mysql.slave1.host: mysql-replica.infra.svc.cluster.local
mysql.slave1.port: "3306"
mysql.slave1.password: root
mysql.slave2.host: mysql-replica.infra.svc.cluster.local
mysql.slave2.port: "3306"
mysql.slave2.password: root

# Finding (spec, Findings): the in-cluster Redis runs WITHOUT requirepass, so
# the password is genuinely the empty string. Do not invent one — the app must
# connect unauthenticated for this env to work.
redis.host: redis-master.infra.svc.cluster.local
redis.port: "6379"
redis.password: ""

mongo.host: mongodb.infra.svc.cluster.local
mongo.port: "27017"
mongo.password: ecommerce123

kafka.bootstrap: kafka.infra.svc.cluster.local:9092
schemaRegistry.host: schema-registry.infra.svc.cluster.local
schemaRegistry.port: "8081"

s3.endpoint: http://minio.infra.svc.cluster.local:9000
