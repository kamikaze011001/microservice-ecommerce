# deploy/secrets/ecommerce.yaml → vault:secret/ecommerce | asm:app/ecommerce
#
# The shared config every service reads (the old docker/vault-configs/
# ecommerce-common.json). Values were transcribed from the golden capture of
# the three old seeding paths, so the equivalence test — not this file — is the
# authority on whether a value is right.
#
# Syntax: {{ref}} comes from contexts/<env>.yaml; ${VAR} from the process
# environment; `envs:` restricts a key to the listed envs (absent elsewhere);
# `owner: user` includes a key only where the context sets
# userCredDelivery: backend.

# --- MySQL (routing datasource: one writer, two readers) --------------------
# The query string is part of the canonical value; only host/port/credentials
# are env-specific.
spring.datasource.master.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.master.url: "jdbc:mysql://{{mysql.master.host}}:{{mysql.master.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.master.username: "{{mysql.username}}"
spring.datasource.master.password: "{{mysql.master.password}}"

spring.datasource.slave1.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.slave1.url: "jdbc:mysql://{{mysql.slave1.host}}:{{mysql.slave1.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.slave1.username: "{{mysql.username}}"
spring.datasource.slave1.password: "{{mysql.slave1.password}}"

spring.datasource.slave2.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.slave2.url: "jdbc:mysql://{{mysql.slave2.host}}:{{mysql.slave2.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.slave2.username: "{{mysql.username}}"
spring.datasource.slave2.password: "{{mysql.slave2.password}}"

# --- MongoDB ----------------------------------------------------------------
# The user (ecommerce), database and authSource are the same everywhere; only
# the host and that user's password move with the env.
spring.data.mongodb.uri: "mongodb://ecommerce:{{mongo.password}}@{{mongo.host}}:{{mongo.port}}/ecommerce_inventory?authSource=admin"
spring.data.mongodb.database:
  value: ecommerce_inventory
  envs: [k8s, aws]

# --- Redis ------------------------------------------------------------------
# Finding (spec, Findings): redis.password is genuinely EMPTY on k8s — the
# in-cluster Redis runs without requirepass and accepts unauthenticated
# connections. Faithfully transcribed from the golden; do not invent a value.
spring.data.redis.host: "{{redis.host}}"
spring.data.redis.port: "{{redis.port}}"
spring.data.redis.password: "{{redis.password}}"
spring.data.redis.database: "0"
spring.data.redis.ssl.enabled:
  value: "true"
  envs: [aws]

# --- Kafka ------------------------------------------------------------------
spring.kafka.bootstrap-servers: "{{kafka.bootstrap}}"
spring.kafka.properties.schema.registry.url: "http://{{schemaRegistry.host}}:{{schemaRegistry.port}}"

# --- Mail -------------------------------------------------------------------
# The SMTP endpoint is a fixed literal; the mailbox credential is user-owned
# and only lands in the secrets backend where the context asks for it (aws).
# Elsewhere it is delivered to the container as an env file.
spring.mail.host: smtp.gmail.com
spring.mail.port: "587"
spring.mail.protocol: smtp
spring.mail.properties.mail.smtp.auth: "true"
spring.mail.properties.mail.smtp.starttls.enable: "true"
spring.mail.username:
  value: "${APPLICATION_MAIL_USERNAME}"
  owner: user
spring.mail.password:
  value: "${APPLICATION_MAIL_PASSWORD}"
  owner: user

# --- Platform ---------------------------------------------------------------
# Both kubernetes envs use cluster DNS instead of Eureka, and both scrape
# Prometheus histograms; compose does neither.
eureka.client.enabled:
  value: "false"
  envs: [k8s, aws]
management.metrics.distribution.percentiles-histogram.http.server.requests:
  value: "true"
  envs: [k8s, aws]
