# deploy/secrets/authorization-server.yaml → vault:secret/authorization-server | asm:app/authorization-server
#
# The token issuer. Every value here is identical in all three envs, and that
# is deliberate rather than incidental: a token minted against one env's key
# must be verifiable by any gateway that trusts the same kid.
#
# application.jwk is the STABLE RSA signing key. The gateway caches JWKS by kid,
# so one differing byte invalidates every token in the system — hence a single
# file on disk referenced from here, never a pasted copy. The kid inside that
# file must stay equal to application.authentication-key-id below.
application.jwk: "<file:jwk.private.json>"
application.authentication-key-id: ecommerce-auth-key-2024

# Milliseconds. 15 minutes access, 7 days refresh.
application.access-token.life-time: "900000"
application.refresh-token.life-time: "604800000"

server.port: "6666"
