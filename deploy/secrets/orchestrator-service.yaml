# deploy/secrets/orchestrator-service.yaml → vault:secret/orchestrator-service | asm:app/orchestrator-service
#
# The saga coordinator. It subscribes to every participant's topic, so most of
# this file is topic names that are identical in all three envs.
#
# Its single datasource (spring.datasource.*) goes through ProxySQL like every
# JPA service; see the MySQL block below for why it never reads a replica.

application.kafka.group-id.mongo.event: mongo-event-group
application.kafka.topics.inventory-service.inventory-product.update-quantity: inventory-service.inventory-product.update-quantity
application.kafka.topics.inventory-service.product.update: inventory-service.product.update
application.kafka.topics.mongo.event: ecommerce_db.ecommerce_inventory.event
application.kafka.topics.order-service.order.canceled-status: order-service.order.canceled-status
application.kafka.topics.order-service.order.failed-status: order-service.order.failed-status
application.kafka.topics.order-service.order.success-status: order-service.order.success-status
application.kafka.topics.product-service.product.update-quantity: product-service.product.update-quantity

application.saga.compensation-max-retries: "3"
application.saga.saga-ttl-minutes: "30"
application.saga.timeout-check-interval: "60000"

# --- MySQL: through ProxySQL like every JPA service (ADR 0012) ---------------
# Saga state is read-modify-write, so it never uses @ReplicaRead: ProxySQL
# sends all of it to the primary. One URL for every service also keeps the
# devbox preview generator's env-wide spring.datasource.url consistent.
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url: "jdbc:mysql://{{mysql.proxy.host}}:{{mysql.proxy.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.username: "{{mysql.proxy.username}}"
spring.datasource.password: "{{mysql.proxy.password}}"

server.port: "9999"
