# deploy/secrets/core-s3.yaml → vault:secret/core-s3 | asm:app/core-s3
#
# Shared by every service that links core/core-s3 (product-service avatars and
# product media). Presigned direct-to-S3 uploads mean these values reach the
# BROWSER, not just the JVM, so the public URLs must be externally resolvable.
#
# s3.access-key/secret-key are EMPTY on aws by design, not by oversight: a blank
# access key is the sentinel that flips core-s3's S3Config to
# DefaultCredentialsProvider (IRSA web identity) instead of static keys.
# See core/core-s3 S3Config.java. s3.endpoint is blank there for the same
# reason — an empty endpoint lets the AWS SDK derive the real regional S3
# endpoint instead of pointing at a MinIO container.
s3.endpoint: "{{s3.endpoint}}"
s3.access-key: "{{s3.accessKey}}"
s3.secret-key: "{{s3.secretKey}}"

s3.bucket: "{{s3.bucket}}"
s3.region: "{{s3.region}}"

# MinIO needs path-style addressing (http://host:9000/bucket/key); real S3 uses
# virtual-hosted style (https://bucket.s3.region.amazonaws.com/key).
s3.path-style: "{{s3.pathStyle}}"

# The origin browsers fetch objects from. On aws this is the bucket's own
# virtual-hosted URL, so it does NOT end in the bucket name the way the MinIO
# path-style forms do — hence a whole-value ref rather than origin + bucket.
s3.public-base-url: "{{s3.publicBaseUrl}}"

# Absent entirely under compose: there the JVM endpoint and the browser
# endpoint are the same localhost address, so core-s3 falls back to
# s3.endpoint. k8s splits them (in-cluster MinIO Service vs the media ingress);
# aws sets it empty so the SDK-derived endpoint is used for both.
s3.public-endpoint:
  value: "{{s3.publicEndpoint}}"
  envs: [k8s, aws]

s3.allowed-types: image/jpeg,image/png,image/webp
s3.max-upload-size: "5242880"
s3.presign-ttl: PT5M
