# deploy/secrets/order-service.yaml → vault:secret/order-service | asm:app/order-service
#
# grpc.server.host/port here is the OUTBOUND target — inventory-service's gRPC
# listener — not a listener of order-service's own. Only the host moves with
# the env (loopback under compose, cluster DNS under k8s/aws); the port is
# inventory-service's fixed container port everywhere.

application.kafka.group-id.order.update-status: order.update-status
application.kafka.topics.order-service.order.canceled-status: order-service.order.canceled-status
application.kafka.topics.order-service.order.failed-status: order-service.order.failed-status
application.kafka.topics.order-service.order.success-status: order-service.order.success-status

grpc.server.host: "{{svc.inventory-service.host}}"
grpc.server.port: "9090"

server.port: "9696"

# --- MySQL: one datasource through ProxySQL (ADR 0012) ----------------------
# Replaces the shared spring.datasource.{master,slave1,slave2} routing set for
# this service: primary by default, a replica only for @ReplicaRead.
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url: "jdbc:mysql://{{mysql.proxy.host}}:{{mysql.proxy.port}}/ecommerce_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
spring.datasource.username: "{{mysql.proxy.username}}"
spring.datasource.password: "{{mysql.proxy.password}}"
