apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: authorization-server
  name: authorization-server
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-server
  template:
    metadata:
      labels:
        app: authorization-server
    spec:
      containers:
      - env:
        - name: VAULT_TOKEN
          value: root
        - name: SPRING_CLOUD_VAULT_URI
          value: http://vault.infra.svc.cluster.local:8200
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+UseStringDeduplication
        - name: MALLOC_ARENA_MAX
          value: "2"
        - name: SPRING_CLOUD_VAULT_ENABLED
          value: "false"
        - name: SPRING_CONFIG_IMPORT
          value: optional:configtree:/etc/app-config/
        envFrom:
        - secretRef:
            name: app-secrets
            optional: true
        image: 583178372344.dkr.ecr.ap-southeast-1.amazonaws.com/authorization-server:dev
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /actuator/health/liveness
            port: management
          initialDelaySeconds: 60
          periodSeconds: 15
        name: authorization-server
        ports:
        - containerPort: 6666
          name: http
        - containerPort: 19091
          name: management
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /actuator/health/readiness
            port: management
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 2000m
            memory: 768Mi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - mountPath: /etc/app-config
          name: app-config
          readOnly: true
      serviceAccountName: authorization-server
      volumes:
      - name: app-config
        secret:
          secretName: authorization-server-config
