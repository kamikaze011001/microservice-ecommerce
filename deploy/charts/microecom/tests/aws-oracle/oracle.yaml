apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: apps
  name: apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-discovery
  namespace: apps
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-discovery
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-discovery
subjects:
- kind: ServiceAccount
  name: gateway
  namespace: apps
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: authorization-server
  name: authorization-server
  namespace: apps
spec:
  ports:
  - name: http
    port: 6666
    targetPort: http
  - name: management
    port: 19091
    targetPort: management
  selector:
    app: authorization-server
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: bff-service
  name: bff-service
  namespace: apps
spec:
