# Base values = the minikube (local-k8s) case. envs/aws.yaml overrides for EKS.
global:
  namespaces:
    infra: infra
    apps: apps
    monitoring: monitoring
    bootstrap: bootstrap
  # Where OUR OWN service images come from. Consumed by the apps subchart
  # (Phase 3); nothing in the infra subchart reads it — every infra workload
  # pins an upstream image tag explicitly.
  #
  # Deliberately NOT named `global.image.registry`. Helm propagates `global:`
  # into EVERY subchart, including vendored upstream ones, and
  # `global.image.registry` is an upstream CONVENTION, not a free name: the
  # victoria-metrics chart family reads it (charts/victoria-metrics-common
  # `vm.internal.image` falls back to it whenever the per-app
  # `image.registry` is empty). Under the old name, vmsingle rendered as
  # `localhost:5000/victoriametrics/victoria-metrics:...` and sat in
  # ImagePullBackOff — which, because `helm --wait` waits for every resource
  # before post-install hooks run, meant the mysql-replication hook Job was
  # never created and the whole release hung at `pending-install`.
  # Renaming is the fix rather than pinning that one chart's registry: the
  # collision is with the convention, so the next upstream chart that adopts
  # it would break the same way. Grafana uses `global.imageRegistry` — also
  # avoid that spelling. See tests/render-test.sh for the assertion.
  appImage:
    registry: localhost:5000
    tag: dev
  secret:
    backend: vault          # vault | externalSecrets
  ingress:
    className: nginx
    hosts:
      storefront: microecom.local
      media: media.microecom.local
      # No `.api` key: nothing reads it. The nginx-path gateway host is
      # `apps.apps.gateway.ingress.host` (charts/apps/values.yaml, hardcoded
      # api.microecom.local); the ALB path has no per-service host at all (one
      # ALB, path-based routing — see charts/apps/templates/ingress.yaml). A
      # `global.ingress.hosts.api` key existed here but was dead: deleted
      # rather than wired through, since wiring it would touch the ingress
      # template for a value this branch doesn't need to change (Minor 1).

# Phase 3 is side by side, not a cut-over: `make k8s-apps` (kubectl) stays the
# default path. Off here so `make k8s-infra-helm` keeps rendering exactly what it
# rendered in Phase 2; `make k8s-apps-helm` passes --set apps.enabled=true.
apps:
  enabled: false

infra:
  enabled: true

  mysql:          { enabled: true, storage: 4Gi }
  mysqlReplica:   { enabled: true, replicas: 2, storage: 4Gi, waitTimeout: 300 }
  mongodb:        { enabled: true, storage: 4Gi }
  redis:          { enabled: true }
  kafka:          { enabled: true, storage: 10Gi }
  minio:          { enabled: true, storage: 10Gi }
  schemaRegistry: { enabled: true }
  kafkaConnect:   { enabled: true }
  kafkaExporter:  { enabled: true }
  mysqldExporter: { enabled: true }

  # EKS only — Phase 7 exercises these.
  storageClassGp3: { enabled: false }
  externalSecrets: { enabled: false, roleArn: "", region: ap-southeast-1 }

  # Upstream chart dependencies. `enabled` is the Helm condition gate and is
  # ignored by the charts themselves; every other key under these is the
  # upstream chart's own values namespace.
  vault:            { enabled: true }
  victoriaMetrics:  { enabled: true }
  grafana:          { enabled: true }
  kubeStateMetrics: { enabled: true }
