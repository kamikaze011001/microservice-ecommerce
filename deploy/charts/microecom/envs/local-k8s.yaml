# minikube is the base case — values.yaml already encodes it. This file exists so
# every environment is selected the same way: -f envs/<env>.yaml
global:
  appImage:
    registry: localhost:5000
    tag: dev

apps:
  apps:
    payment-service:
      # Local checkout goes through mock-paypal-service, not api-m.paypal.com.
      # Without these, checkout silently calls the real PayPal sandbox and fails.
      # springConfig renders as SPRING_APPLICATION_JSON (see apps.container).
      # Short Service name, not the FQDN: it resolves in whatever namespace the
      # env runs in, so a devbox preview reaches ITS mock-paypal, not prod-like's.
      springConfig:
        application:
          paypal:
            base-url: http://mock-paypal-service:8585/mock-paypal-service
      env:
        PAYPAL_TUNNEL_URL: "http://api.microecom.local"
