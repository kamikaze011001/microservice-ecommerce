{{- if .Values.kafkaExporter.enabled }}
{{- $ns := .Values.global.namespaces.infra -}}
{{- $kafka := printf "%s:9092" (include "microecom.fqdn" (dict "name" "kafka" "namespace" $ns)) -}}
# kafka-exporter — exposes Kafka topic/partition offsets and consumer-group lag
# in Prometheus format on :9308. Connects to the single KRaft broker (kafka:9092,
# PLAINTEXT). The headline metric is kafka_consumergroup_lag (saga consumers
# keeping up). Replication metrics are degenerate at RF=1 (single broker).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  replicas: 1
  # Raised well above the k8s default of 600s: a cold image pull can outrun it
  # and mark the Deployment Failed mid-pull, which fails the whole helm release.
  # Full measurements and why --timeout 30m does NOT cover this: values.yaml.
  progressDeadlineSeconds: {{ $.Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
    spec:
      enableServiceLinks: false
      # kafka-exporter hard-exits when no broker answers. install.sh worked
      # around that by applying it after Kafka's rollout and then restarting it.
      # Blocking here instead means the exporter also recovers on its own when
      # Kafka restarts later — which the script never handled.
      initContainers:
        {{- include "microecom.waitForKafka" (dict "kafka" $kafka) | nindent 8 }}
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args:
            - --kafka.server={{ $kafka }}
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
{{- end }}
