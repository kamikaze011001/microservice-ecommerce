{{- if .Values.mysqlReplica.enabled }}
{{- $ns := .Values.global.namespaces.infra -}}
# MySQL read replicas — 2 pods replicating from the primary (mysql.yaml) via
# GTID auto-position. Brings the kind cluster in line with docker/mysql.yml's
# 1-master/2-slave topology. Replication is established by k8s/infra/install.sh
# after both StatefulSets are Ready (mirrors docker/scripts/init-mysql.sh).
#
# The read Service `mysql-replica` (mysql-replica-service.yaml) selects these
# component=replica pods and load-balances reads across them. This headless
# Service is the StatefulSet's governing service for stable per-pod identity.
#
# LOCAL-DEV ONLY: same plaintext creds as the primary (mysql-credentials). The
# AWS overlay replaces MySQL with RDS, so this file is local-only.
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-headless
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
spec:
  serviceName: mysql-replica-headless
  replicas: {{ .Values.mysqlReplica.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: replica
    spec:
      initContainers:
        # Derive a unique server-id per replica from the StatefulSet pod ordinal
        # (mysql-replica-0 -> 100, mysql-replica-1 -> 101). Copy the image's
        # default conf.d (keeps docker.cnf: skip-host-cache/skip-name-resolve)
        # into the shared volume, then append our server-id snippet. The official
        # image !includedir's /etc/mysql/conf.d, so it is picked up at boot.
        - name: server-id
          image: mysql:8.0.40
          command:
            - sh
            - -c
            - |
              cp -a /etc/mysql/conf.d/. /mnt/conf/ 2>/dev/null || true
              ORD="${HOSTNAME##*-}"
              printf '[mysqld]\nserver-id=%s\n' "$((100 + ORD))" > /mnt/conf/server-id.cnf
              echo "wrote server-id=$((100 + ORD))"
          volumeMounts:
            - name: conf
              mountPath: /mnt/conf
      containers:
        - name: mysql
          image: mysql:8.0.40
          ports:
            - name: mysql
              containerPort: 3306
          # Replicas take ONLY the root password + database name from the shared
          # secret — NOT MYSQL_USER/MYSQL_PASSWORD. The mysql entrypoint binlogs
          # `CREATE USER '<MYSQL_USER>'@'%'` (NOT idempotent, runs outside its
          # SET SQL_LOG_BIN=0 block). If the replica also created that user
          # locally, replaying the primary's CREATE USER aborts the SQL thread
          # (Replica_SQL_Running: No). The app user arrives via replication
          # instead; the app reads replicas as root. Mirrors docker/mysql.yml
          # slaves (which omit MYSQL_USER).
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
          # No --server-id here: it comes from /etc/mysql/conf.d/server-id.cnf
          # written per-pod by the initContainer. We intentionally do NOT set
          # --skip-slave-start: mysqld then auto-starts replication on every boot
          # when master.info exists, so replicas self-heal after a node/Docker
          # restart (otherwise they come back Replica_*_Running: No until someone
          # runs START REPLICA). Fresh PVCs have no master.info, so first boot is
          # still safe; install.sh runs STOP REPLICA before CHANGE REPLICATION
          # SOURCE to tolerate the harmless auto-start on a configured replica.
          args:
            - --log-bin=mysql-bin
            - --binlog-format=row
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --default-authentication-plugin=mysql_native_password
            - --read-only=ON
            - --replica-parallel-workers=8
            - --replica-parallel-type=LOGICAL_CLOCK
            - --replica-preserve-commit-order=ON
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: conf
              mountPath: /etc/mysql/conf.d
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-proot"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-proot"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysqlReplica.storage }}
---
# Read Service: app slave1/slave2 DSNs resolve here (see vault-seed). Selects the
# component=replica pods (mysql-replica.yaml) and load-balances reads across the
# 2 replicas. Writes go to the separate `mysql` Service (component=primary).
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: {{ $ns }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
{{- end }}
