{{- if .Values.storageClassGp3.enabled }}
{{/*
A fresh EKS cluster defaults to gp2 and the gp3 StorageClass must exist before
any PVC or the infra bring-up stalls
(.claude/memory/conventions/eks-gp3-storageclass-must-precede-pvcs.md).

Helm's install order places StorageClass ahead of PersistentVolumeClaim
unconditionally, so inside the chart that hazard is structurally impossible
rather than documented. fsType stays xfs: ext4's lost+found in the root
directory breaks Kafka's log.dir
(.claude/memory/conventions/... / project_kafka_ebs_lostfound).
*/}}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
  # Format xfs, not the EBS CSI default (ext4). ext4 creates a `lost+found`
  # directory at the filesystem root; Kafka scans its log.dir and crashes on any
  # non-topic-partition entry ("Found directory .../lost+found"). xfs has no
  # lost+found, so Kafka (and Mongo — xfs is MongoDB's recommended FS) start
  # clean. This is a filesystem concern, so it lives here in the AWS storage
  # layer — the portable app manifests (kafka.yaml) stay untouched, and kind is
  # unaffected (it uses its own local-path provisioner, not this class).
  csi.storage.k8s.io/fstype: xfs
{{- end }}
