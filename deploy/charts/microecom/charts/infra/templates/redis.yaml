{{- if .Values.redis.enabled }}
{{- $ns := .Values.global.namespaces.infra -}}
# Redis — Docker Official Image (redis:7.4-alpine), single-node CACHE.
# Replaces the Bitnami chart (docker.io/bitnami/redis deleted 2025-09-29).
#
# Pure cache: no auth, no persistence (matches the retired Bitnami values —
# architecture=standalone, auth.enabled=false, persistence.enabled=false).
# Because nothing is persisted there is no stable identity to preserve, so a
# plain Deployment + no volume is correct — NOT a StatefulSet. The app
# repopulates the cache after a restart.
#
# Service name MUST be `redis-master`: 03-vault-seed hardcodes
# redis-master.infra.svc.cluster.local:6379 into the secret every service
# reads via core-redis. The name is a contract, not a label.
#
# LOCAL-DEV ONLY: no password. AWS overlay points core-redis at ElastiCache
# (host/password via ExternalSecrets) — a Vault-only change, no app change.
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - --save
            - ""              # disable RDB snapshots — pure in-memory cache
            - --appendonly
            - "no"            # disable AOF — no persistence
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
{{- end }}
