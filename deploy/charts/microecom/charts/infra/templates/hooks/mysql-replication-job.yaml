{{- if and .Values.mysql.enabled .Values.mysqlReplica.enabled }}
{{- $ns := .Values.global.namespaces.infra -}}
{{- $primary := include "microecom.fqdn" (dict "name" "mysql" "namespace" $ns) -}}
{{- $headless := include "microecom.fqdn" (dict "name" "mysql-replica-headless" "namespace" $ns) -}}
{{/*
Sprig's `int` silently coerces anything it can't parse to 0 — it does not
error. A malformed `--set infra.mysqlReplica.waitTimeout=abc` would otherwise
render WAIT_TIMEOUT="0" and activeDeadlineSeconds derived from a 0 host
timeout, turning a typo into an immediate, misleading "unreachable after 0s"
failure instead of a clear config error. Fail the render instead.
*/}}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.mysqlReplica.waitTimeout)) -}}
{{- fail (printf "infra.mysqlReplica.waitTimeout must be a positive integer, got %q" (toString .Values.mysqlReplica.waitTimeout)) -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.mysqlReplica.replicas)) -}}
{{- fail (printf "infra.mysqlReplica.replicas must be a positive integer, got %q" (toString .Values.mysqlReplica.replicas)) -}}
{{- end -}}
{{- $waitTimeout := int .Values.mysqlReplica.waitTimeout -}}
{{- $hostCount := add1 (int .Values.mysqlReplica.replicas) -}}
{{- $postWaitSlack := 60 -}}
{{- $deadline := add (mul $hostCount $waitTimeout) $postWaitSlack -}}
---
# MySQL replication: 1 primary + N replicas (GTID auto-position).
#
# Mirrors docker/scripts/init-mysql.sh and k8s/infra/install.sh:135-182,
# idempotent. The repl user is created on the primary AFTER init (so it
# replicates); replicas use SOURCE_AUTO_POSITION=1 to pull the full binlog from
# empty (no clone needed).
#
# Helm's sequence is: pre-install hooks -> create resources -> wait for
# readiness (ONLY with --wait) -> post-install hooks. `--wait` is therefore
# load-bearing, not cosmetic. The job polls for reachability anyway so it
# survives being run without it.
#
# Unlike the script this replaces, it touches no Kubernetes API: it is a plain
# mysql client dialling Service DNS, so it needs no ServiceAccount and no RBAC.
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-replication
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  # activeDeadlineSeconds is derived from the same numbers wait_for() uses,
  # not hardcoded, so it can never be smaller than one complete graceful
  # attempt. wait_for() runs sequentially over every host (1 primary + N
  # replicas), each allowed its own full WAIT_TIMEOUT before it reports a
  # readable "host X unreachable after Ns" error — so the deadline must cover
  # at least hostCount * WAIT_TIMEOUT, plus a flat slack for the steps after
  # wait_for() that WAIT_TIMEOUT doesn't bound (repl-user setup, the
  # per-replica idempotence check, CHANGE REPLICATION SOURCE, and the final
  # sleep 5 + SHOW REPLICA STATUS verification loop — all quick per host).
  # With the default mysqlReplica.replicas=2 and waitTimeout=300 this renders
  # to 960s ((1 + 2 hosts) * 300s + 60s slack).
  #
  # This intentionally sizes ONE attempt, not all backoffLimit retries
  # combined. activeDeadlineSeconds is measured from the Job's startTime
  # across every retry, but the graceful, readable-error path is
  # WAIT_TIMEOUT's job, not this backstop's — once a full honest attempt has
  # burned through its whole budget without success, cutting the remaining
  # retries short is the intended behaviour. This deadline exists only to
  # catch a genuinely hung pod (OOM mid mysql-client-call, a wedged image
  # pull) that never reaches wait_for()'s own timeout check.
  activeDeadlineSeconds: {{ $deadline }}
  template:
    metadata:
      name: mysql-replication
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: replication
          image: mysql:8.0.40
          envFrom:
            - secretRef:
                name: mysql-credentials
          env:
            - name: PRIMARY_HOST
              value: {{ $primary | quote }}
            - name: REPLICA_HOSTS
              value: {{ range $i := until (int .Values.mysqlReplica.replicas) }}mysql-replica-{{ $i }}.{{ $headless }} {{ end }}
            - name: WAIT_TIMEOUT
              value: {{ $waitTimeout | quote }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              ROOT="-uroot -p${MYSQL_ROOT_PASSWORD}"
              # Bounded poll: install.sh's imperative version was gated behind
              # `kubectl rollout status --timeout=5m`, failing fast on a bad
              # Secret or crashloop. This Job has no such gate, so wait_for()
              # must own its own timeout or an unreachable host stalls
              # `helm install --wait` indefinitely. The container's WAIT_TIMEOUT
              # env var (set above from .Values.mysqlReplica.waitTimeout, default
              # 300) is what actually overrides this for slower environments;
              # the ${WAIT_TIMEOUT:-300} fallback here only matters if that env
              # var is somehow absent, keeping the same default in sync.
              WAIT_TIMEOUT="${WAIT_TIMEOUT:-300}"

              wait_for() {
                local host=$1
                local waited=0
                echo "waiting for ${host}"
                until mysql -h "$host" $ROOT -e 'SELECT 1' >/dev/null 2>&1; do
                  sleep 3
                  waited=$((waited + 3))
                  if [ "$waited" -ge "$WAIT_TIMEOUT" ]; then
                    echo "ERROR: ${host} unreachable after ${WAIT_TIMEOUT}s"
                    exit 1
                  fi
                done
                echo "${host} is up"
              }

              wait_for "$PRIMARY_HOST"
              for rep in $REPLICA_HOSTS; do wait_for "$rep"; done

              echo "configuring replication user on the primary"
              mysql -h "$PRIMARY_HOST" $ROOT -e "
                CREATE USER IF NOT EXISTS '${MYSQL_REPL_USER}'@'%'
                  IDENTIFIED WITH mysql_native_password BY '${MYSQL_REPL_PASSWORD}';
                GRANT REPLICATION SLAVE ON *.* TO '${MYSQL_REPL_USER}'@'%';
                FLUSH PRIVILEGES;"

              for rep in $REPLICA_HOSTS; do
                running=$(mysql -h "$rep" $ROOT -N -e \
                  "SELECT COUNT(*) FROM performance_schema.replication_connection_status
                   WHERE SERVICE_STATE='ON';" 2>/dev/null || echo 0)
                if [ "${running:-0}" -ge 1 ]; then
                  echo "$rep already replicating; skipping"
                  continue
                fi
                echo "starting replication on $rep"
                mysql -h "$rep" $ROOT -e "
                  STOP REPLICA;
                  CHANGE REPLICATION SOURCE TO
                    SOURCE_HOST='${PRIMARY_HOST}',
                    SOURCE_USER='${MYSQL_REPL_USER}',
                    SOURCE_PASSWORD='${MYSQL_REPL_PASSWORD}',
                    SOURCE_AUTO_POSITION=1,
                    GET_SOURCE_PUBLIC_KEY=1;
                  START REPLICA;"
              done

              # Verify; fail the release rather than seed onto a broken topology.
              # `|| true` on the query itself: under `set -e`, a bare failed
              # command substitution (not part of an if/while test) aborts the
              # whole script immediately, so one unreachable replica would kill
              # the loop before it could report on the others. This mirrors a
              # pre-existing gap in the install.sh version this Job replaces
              # (same missing guard there), not a new regression — call it out
              # explicitly rather than let the surrounding "hardened" comments
              # overstate what this step actually covers.
              sleep 5
              rc=0
              for rep in $REPLICA_HOSTS; do
                status=$(mysql -h "$rep" $ROOT -e 'SHOW REPLICA STATUS\G' 2>/dev/null || true)
                if [ -z "$status" ]; then
                  echo "ERROR: $rep unreachable for the post-verify status check"
                  rc=1
                  continue
                fi
                if echo "$status" | grep -q 'Replica_IO_Running: Yes' \
                   && echo "$status" | grep -q 'Replica_SQL_Running: Yes'; then
                  echo "$rep replication OK"
                else
                  echo "ERROR: $rep replication not running:"
                  echo "$status" | grep -E 'Replica_IO_Running:|Replica_SQL_Running:|Last_IO_Error:|Last_SQL_Error:'
                  rc=1
                fi
              done
              [ "$rc" -eq 0 ] && echo "MySQL replication ready (1 primary + N replicas)"
              exit "$rc"
{{- end }}
