{{- if .Values.externalSecrets.enabled }}
{{- $ns := .Values.global.namespaces.infra -}}
# ESO ServiceAccount (IRSA target). Applied BEFORE the Helm install: the chart
# runs with serviceAccount.create=false, so this SA must already exist or the
# controller pod can't be scheduled (SA admission rejects it) and `helm --wait`
# deadlocks. The SA name/namespace MUST match the eso_irsa oidc_providers entry
# in aws/main/secrets.tf (infra:external-secrets). infra-up.sh stamps the real
# role ARN onto the annotation from `terraform output eso_irsa_role_arn`.
#
# NOTE (both objects in this file, both gated by the same
# externalSecrets.enabled flag): the SA above and the ClusterSecretStore below
# document a REAL two-phase apply-ordering constraint (SA before the ESO
# controller's own `helm install`; Store only after it, once the
# ClusterSecretStore CRD exists) that this file's shape does NOT enforce —
# rendering this template with the flag on always produces both objects
# together in one pass. Deferred to a future integration phase (do not build
# it here): whoever wires externalSecrets.enabled=true into a shared
# `helm upgrade` that also owns the ESO chart install MUST either split this
# into two templates applied around that install (mirroring
# scripts/aws/infra-up.sh's current two-`kubectl apply -f` shape), or rely on
# Helm hook-weight ordering (pre-install for the SA, post-install for the
# Store) if ESO becomes a chart dependency — do not assume this single file
# is safe to fold into that install unmodified.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: {{ $ns }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.roleArn }}
---
# ESO ClusterSecretStore — applied AFTER the Helm install, because it needs the
# ClusterSecretStore CRD that the chart installs (installCRDs=true). Points ESO
# at our region's Secrets Manager, authenticating as the external-secrets SA
# (see above) via IRSA. The store name MUST match the secretStoreRef.name in
# every per-service ExternalSecret (aws-secrets-manager).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: {{ $ns }}
{{- end }}
