# One Argo CD Application per (env, service): every file
#   envs/<env>/services/<service>.yaml
# in the env-config repo becomes an Application named <env>-<service>.
# Add a service = add a file. Add an env = add a folder.
#
# Each Application renders the apps subchart from the code repo (the `devbox`
# branch you pushed) with two values files from the env repo, narrowed to one
# service by onlyService. Per-service Applications are what give each service
# its own tile, health, sync status and history in the UI — and what let you
# roll back order-service without touching inventory-service.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microecom-envs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://gitea-http.devbox.svc.cluster.local:3000/devbox/env-config.git
        revision: main
        files:
          - path: "envs/*/services/*.yaml"
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        devbox.env: '{{ index .path.segments 1 }}'
        devbox.service: '{{ trimSuffix ".yaml" .path.filename }}'
      # Deleting the Application deletes what it deployed. Without this, removing
      # an env's folder (make devbox-env-delete) would delete the Applications
      # and ORPHAN every Deployment/Service they owned.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        # The HOW: the chart, from your last `make devbox-push`.
        - repoURL: http://gitea-http.devbox.svc.cluster.local:3000/devbox/microecom.git
          targetRevision: devbox
          path: deploy/charts/microecom/charts/apps
          helm:
            # Same release name as `make k8s-apps-helm`, so the rendered labels
            # (and immutable Deployment selectors) are identical on both paths.
            releaseName: microecom
            valueFiles:
              - '$env/envs/{{ index .path.segments 1 }}/env.yaml'
              - '$env/{{ .path.path }}/{{ .path.filename }}'
            parameters:
              - name: onlyService
                value: '{{ trimSuffix ".yaml" .path.filename }}'
        # The WHAT: versions and config. `ref: env` makes it addressable as
        # $env above; it deploys nothing by itself.
        - repoURL: http://gitea-http.devbox.svc.cluster.local:3000/devbox/env-config.git
          targetRevision: main
          ref: env
      # One namespace per env: prod-like keeps `apps`; preview-x → apps-preview-x.
      # Must match the env's global.namespaces.apps (env_gen.py writes both from
      # the same rule). devbox-env-create makes the namespace first, so it can
      # copy app-secrets in before any pod starts.
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ if eq (index .path.segments 1) "prod-like" }}apps{{ else }}apps-{{ index .path.segments 1 }}{{ end }}'
      syncPolicy:
        automated:
          prune: true     # a service file deleted from git → its objects deleted
          selfHeal: true  # a kubectl edit → reverted to what git says
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
