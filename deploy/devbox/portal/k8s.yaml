# devbox-portal — platform tooling, so it lives in `devbox` next to Gitea and
# is applied by deploy/devbox/devbox.sh (`portal`), not by the ApplicationSet:
# the thing that changes envs shouldn't itself be an env's app.
#
# Images: PORTAL_IMAGE and RUNNER_IMAGE are replaced by devbox.sh with the built tags.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devbox-portal
  namespace: devbox
---
# Least privilege: read Argo CD Applications and annotate them (the refresh
# nudge). Nothing in any app namespace; no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devbox-portal
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devbox-portal
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: devbox-portal
    namespace: devbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devbox-portal
---
# The portal starts runner Jobs and reads their pods' logs — in `devbox` only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devbox-portal-jobs
  namespace: devbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devbox-portal-jobs
  namespace: devbox
subjects:
  - kind: ServiceAccount
    name: devbox-portal
    namespace: devbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devbox-portal-jobs
---
# The Platform tools page shows each tool's login, read live from its own
# Secret — exactly these two Secrets (resourceNames), nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devbox-portal-argocd-login
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-initial-admin-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devbox-portal-argocd-login
  namespace: argocd
subjects:
  - { kind: ServiceAccount, name: devbox-portal, namespace: devbox }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: devbox-portal-argocd-login }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devbox-portal-grafana-login
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devbox-portal-grafana-login
  namespace: monitoring
subjects:
  - { kind: ServiceAccount, name: devbox-portal, namespace: devbox }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: devbox-portal-grafana-login }
---
# The runner does what `make devbox-env-create` does with your kubeconfig:
# creates namespaces, copies a Secret, execs into infra pods, nudges Argo CD.
# That is cluster-admin-shaped work, so it gets cluster-admin — acceptable on
# a single-user local cluster ONLY. The portal can't choose what it runs: the
# Job's command is fixed per kind (JobKind), never a command line.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devbox-runner
  namespace: devbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devbox-runner
subjects:
  - kind: ServiceAccount
    name: devbox-runner
    namespace: devbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox-portal
  namespace: devbox
  labels: { app.kubernetes.io/name: devbox-portal, app.kubernetes.io/part-of: devbox }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: devbox-portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: devbox-portal, app.kubernetes.io/part-of: devbox }
    spec:
      serviceAccountName: devbox-portal
      containers:
        - name: devbox-portal
          image: PORTAL_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8282 }
            - { name: management, containerPort: 18282 }
          env:
            - { name: RUNNER_IMAGE, value: RUNNER_IMAGE }
            - name: GITEA_PASSWORD
              valueFrom: { secretKeyRef: { name: devbox-portal, key: gitea-password } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: devbox-portal
  namespace: devbox
  labels: { app.kubernetes.io/name: devbox-portal, app.kubernetes.io/part-of: devbox }
spec:
  selector: { app.kubernetes.io/name: devbox-portal }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Every devbox UI by name through the ingress (minikube tunnel + /etc/hosts,
# like the storefront) — nothing to port-forward and keep alive.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devbox-portal
  namespace: devbox
spec:
  ingressClassName: nginx
  rules:
    - host: devbox.microecom.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: devbox-portal, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: devbox
spec:
  ingressClassName: nginx
  rules:
    - host: gitea.microecom.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: gitea-http, port: { number: 3000 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ui
  namespace: devbox
spec:
  ingressClassName: nginx
  rules:
    - host: registry.microecom.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: registry-ui, port: { number: 80 } } } }
---
# Argo CD runs with server.insecure (plain HTTP behind the ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.microecom.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: argocd-server, port: { number: 80 } } } }
