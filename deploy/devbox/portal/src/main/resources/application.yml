spring:
  application:
    name: devbox-portal
  jackson:
    # The repo's wire format (root CLAUDE.md): snake_case on every DTO.
    property-naming-strategy: SNAKE_CASE

server:
  port: 8282

# Same split as every service here: actuator on http+10000, never behind an Ingress.
management:
  server:
    port: 18282
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# In-cluster defaults (namespace devbox). Override any of them with env vars,
# e.g. DEVBOX_GITEA_URL=http://localhost:3300 to run the portal on your laptop
# against `make devbox-open`'s forwards.
devbox:
  gitea:
    url: http://gitea-http.devbox.svc.cluster.local:3000
    user: devbox
    password: ${GITEA_PASSWORD:}
    owner: devbox
    env-repo: env-config
    branch: main
    code-repo: microecom
  registry-url: http://registry.kube-system.svc.cluster.local
  metrics-url: http://vmsingle.monitoring.svc.cluster.local:8428
  argo-namespace: argocd
  # The API console's proxy target; {namespace} = apps for prod-like, apps-<env> for a preview.
  gateway-url: http://gateway.{namespace}.svc.cluster.local:6868
  # Ingress hosts (minikube tunnel + /etc/hosts, like the storefront) — no
  # port-forward to keep alive.
  links:
    argocd: http://argocd.microecom.local
    gitea: http://gitea.microecom.local
    grafana: http://grafana.microecom.local
    registry: http://registry.microecom.local
  # The Job that runs devbox.sh for the page (create/delete env, …).
  # RUNNER_IMAGE is set by devbox.sh `portal`; unset = jobs disabled.
  runner:
    image: ${RUNNER_IMAGE:}
    namespace: devbox
    service-account: devbox-runner
    max-previews: ${MAX_PREVIEWS:1}
