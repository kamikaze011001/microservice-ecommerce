# The prod-like env — settings shared by every service in it.
#
# This repo (Gitea: devbox/env-config) is the DESIRED STATE of your local
# envs. Argo CD renders the apps chart with this file + one services/<svc>.yaml
# and keeps the cluster equal to the result. To change the env, commit here;
# don't kubectl-edit the cluster (self-heal reverts it within seconds).
#
# Format: values of the apps subchart (deploy/charts/microecom/charts/apps),
# rendered on its own — so `global:` must be complete here; the umbrella
# chart's values.yaml is NOT in play.
global:
  namespaces:
    apps: apps
  appImage:
    registry: localhost:5000
    # Fallback for any service whose file doesn't pin its own image.tag.
    tag: dev
  secret:
    backend: vault
  ingress:
    className: nginx
    hosts:
      storefront: microecom.local
