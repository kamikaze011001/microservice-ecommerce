# payment-service in prod-like. One file = one Argo CD Application (prod-like-payment-service).
# Deploy another version: change image.tag and commit.
apps:
  payment-service:
    image:
      tag: dev
    # Local checkout goes through mock-paypal-service, not api-m.paypal.com.
    # Without these, checkout silently calls the real PayPal sandbox and fails.
    # springConfig = Spring properties; rendered as SPRING_APPLICATION_JSON,
    # which overrides Vault key by key.
    springConfig:
      application:
        paypal:
          base-url: http://mock-paypal-service:8585/mock-paypal-service
    env:
      PAYPAL_TUNNEL_URL: "http://api.microecom.local"
