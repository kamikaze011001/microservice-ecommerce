spring:
  application:
    name: product-service
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        default-context: ecommerce
        application-name: product-service,core-s3
  config:
    import: optional:vault://
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the Avro deserializer so an unreadable record becomes a DeserializationException
      # the error handler dead-letters (core-kafka-consumer). A bare KafkaAvroDeserializer
      # throws inside poll() and wedges the partition on that record forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        # Incremental rebalances: when a pod joins or leaves, only the partitions that change
        # owner pause; every other partition keeps consuming.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
      # A brand-new consumer group starts from the oldest retained record instead of
      # silently skipping everything already on the topic.
      auto-offset-reset: earliest
application:
  kafka:
    group-id:
      product-service.product.update-quantity: product-service.product.update-quantity
    topics:
      inventory-service.product.update: inventory-service.product.update
      product-service.product.update-quantity: product-service.product.update-quantity
  i18n:
    resources:
      - classpath:messages
      - classpath:messages/product
server:
  servlet:
    context-path: /product-service
management:
  server:
    port: 17777
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,dltreplay
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo
  metrics:
    tags:
      application: ${spring.application.name}