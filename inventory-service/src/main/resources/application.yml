spring:
  application:
    name: inventory-service
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        default-context: ecommerce
        application-name: inventory-service
  config:
    import: optional:vault://
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the Avro deserializer so an unreadable record becomes a DeserializationException
      # the error handler dead-letters (core-kafka-consumer). A bare KafkaAvroDeserializer
      # throws inside poll() and wedges the partition on that record forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        # Incremental rebalances: when a pod joins or leaves, only the partitions that change
        # owner pause; every other partition keeps consuming.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
      # A brand-new consumer group starts from the oldest retained record instead of
      # silently skipping everything already on the topic.
      auto-offset-reset: earliest
server:
  servlet:
    context-path: /inventory-service
application:
  i18n:
    resources:
      - classpath:messages
      - classpath:messages/inventory
  kafka:
    group-id:
      product.update: product-update-group
      payment.success: payment-success-group
    topics:
      inventory-service.product.update: inventory-service.product.update
      inventory-service.inventory-product.update-quantity: inventory-service.inventory-product.update-quantity
management:
  server:
    port: 16969
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,dltreplay
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}